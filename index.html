<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F7A4D" />
    <title>NutriTrack — Atur gizi sesuai budget</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript>Aktifkan JavaScript untuk memakai NutriTrack.</noscript>

    <!-- Urutan penting: data → logika → inti (state & registry) → backend → fitur → app.js paling akhir -->
    <!-- Data & utilitas -->
    <script src="js/data/foods.js"></script>
    <script src="js/utils/format.js"></script>
    <!-- Lapisan logika (bisa diuji di test.html) -->
    <script src="js/logic/nutrition.js"></script>
    <!-- Inti aplikasi -->
    <script src="js/core/helpers.js"></script>
    <script src="js/core/registry.js"></script>
    <script src="js/core/state.js"></script>
    <!-- Fitur: satu file per menu -->
    <script src="js/features/profile.js"></script>
    <script src="js/features/dashboard.js"></script>
    <script src="js/features/foodlog.js"></script>
    <script src="js/core/app.js"></script>
  </body>
</html>
